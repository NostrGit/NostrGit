<!DOCTYPE html>

    }

      animation: fadeIn 0.2s ease-out;

        user: html`<svg class="${className}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>`,

    // Navigation Component
    const Navigation = ({ currentPage, nostrPubkey, nostrConnecting, onConnect, onDisconnect }) => {

        { name: 'Home', path: '', icon: 'home' },
        { name: 'Explore', path: 'explore', icon: 'zap' },
        { name: 'Issues', path: 'issues', icon: 'messageCircle' },

        <nav class="border-b border-lightgray bg-dark/50 backdrop-blur-sm sticky top-0 z-50">

            <div class="flex items-center justify-between h-16">

                <${Icon} name="gitBranch" className="h-8 w-8 text-purple-500" />

              </div>
              <div class="flex items-center gap-4">
                <div class="flex items-center gap-1">
                  ${navItems.map(item => html`
                    <a
                      href=${`#${item.path}`}
                      class="${currentPage === item.path ? 'bg-purple-600 text-white' : 'text-gray-400 hover:text-white hover:bg-dark'} px-4 py-2 rounded-lg transition-all duration-200 flex items-center gap-2"

    // About Page Component
    const AboutPage = () => html`
      <div class="min-h-screen">
        <div class="container mx-auto px-4 py-16 max-w-4xl">
          <h1 class="text-5xl font-bold mb-8 bg-gradient-to-r from-white to-purple-400 bg-clip-text text-transparent">

              <p class="text-gray-400">

              </p>
            </div>

            <h2 class="text-3xl font-bold mt-12 mb-4 text-white">The Problem</h2>
            <p>

            </p>
            <ul class="list-disc list-inside space-y-2 ml-4">

              <li>They can be subject to government takedown requests</li>

            <h2 class="text-3xl font-bold mt-12 mb-4 text-white">The Solution</h2>
            <p>
              NostrGit leverages the Nostr protocol to create a truly decentralized code hosting solution:
            </p>
            <ul class="list-disc list-inside space-y-2 ml-4">
              <li>Repositories are announced as Nostr events (NIP-34)</li>
              <li>Multiple relays host the same information</li>
              <li>No single point of failure</li>
              <li>Cryptographic verification ensures authenticity</li>
              <li>Anyone can run a relay and participate</li>

            <div class="bg-purple-900/20 border border-purple-500/30 rounded-lg p-6 my-8">
              <h2 class="text-2xl font-bold mb-4 text-white">NIP-34: Git Repository Announcements</h2>

    // Repository Page Component with Tabs
    class RepoPage extends Component {
      constructor(props) {
        super(props);
        this.state = {
          activeTab: 'overview',
          copiedClone: false,
          showNewIssue: false
        };
      }

      handleCopyClone(cloneUrl) {
        navigator.clipboard.writeText(`git clone ${cloneUrl}`).then(() => {
          this.setState({ copiedClone: true });
          setTimeout(() => this.setState({ copiedClone: false }), 2000);
        });
      }

      formatDate(timestamp) {
        const now = Date.now() / 1000;
        const diff = now - timestamp;

        if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
        if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
        if (diff < 2592000) return `${Math.floor(diff / 86400)}d ago`;

        return new Date(timestamp * 1000).toLocaleDateString('en-US', {
          month: 'short',
          day: 'numeric',
          year: 'numeric',
        });
      }

      render() {
        const { repo, allIssues = [] } = this.props;
        const { activeTab, copiedClone } = this.state;

        if (!repo) {
          return html`
            <div class="min-h-screen flex items-center justify-center">
              <div class="text-center">
                <${Icon} name="alertCircle" className="h-16 w-16 text-gray-500 mx-auto mb-4" />
                <h2 class="text-2xl font-bold text-white mb-2">Repository not found</h2>
                <p class="text-gray-400 mb-6">This repository could not be loaded</p>
                <a href="#explore" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg transition-colors">
                  Back to Explore
                </a>
              </div>
            </div>
          `;
        }

        // Filter issues for this repository
        const repoIssues = allIssues.filter(issue => {
          if (!issue.repository) return false;
          // Match by identifier or name
          const repoParts = issue.repository.split(':');
          const repoId = repoParts[repoParts.length - 1];
          return repoId === repo.identifier || repoId === repo.name;
        });

        return html`
          <div class="min-h-screen">
            <!-- Header -->
            <div class="bg-gradient-to-br from-purple-900/20 via-dark to-dark border-b border-lightgray">
              <div class="container mx-auto px-4 py-8">
                <div class="flex items-center gap-2 text-sm text-gray-400 mb-4">
                  <a href="#explore" class="hover:text-purple-400 transition-colors">Explore</a>
                  <${Icon} name="arrowRight" className="h-3 w-3" />
                  <span class="text-white">${repo.name}</span>
                </div>

                <div class="flex items-start justify-between gap-4 mb-6">
                  <div class="flex-1">
                    <h1 class="text-4xl font-bold text-white mb-3">${repo.name}</h1>
                    ${repo.description ? html`
                      <p class="text-xl text-gray-300 leading-relaxed">${repo.description}</p>
                    ` : null}
                  </div>
                </div>

                <!-- Tab Navigation -->
                <div class="flex items-center gap-2 border-b border-lightgray -mb-px">
                  <button
                    onClick=${() => this.setState({ activeTab: 'overview' })}
                    class="${activeTab === 'overview' ? 'border-purple-500 text-white' : 'border-transparent text-gray-400 hover:text-white'} px-4 py-3 border-b-2 font-medium transition-colors"

    // New Issue Form Component
    class NewIssueForm extends Component {
      constructor(props) {
        super(props);
        this.state = {
          title: '',
          description: '',
          submitting: false,
          error: null
        };
      }

      async handleSubmit(e) {
        e.preventDefault();
        const { title, description } = this.state;
        const { repo, nostrPubkey, publishEvent, onSuccess, onClose } = this.props;

        if (!title.trim()) {
          this.setState({ error: 'Title is required' });
          return;
        }

        this.setState({ submitting: true, error: null });

        try {
          // Create NIP-34 issue event (kind 30618)
          const event = {
            kind: 30618,
            created_at: Math.floor(Date.now() / 1000),
            tags: [
              ['d', `${Date.now()}`], // unique identifier
              ['title', title],
              ['a', `30617:${repo.pubkey}:${repo.identifier || repo.name}`], // repository reference
              ['status', 'open']
            ],
            content: description
          };

          const result = await publishEvent(event);

          if (result.successful > 0) {
            this.setState({ title: '', description: '', submitting: false });
            if (onSuccess) onSuccess(result.signedEvent);
            if (onClose) onClose();
            alert(`Issue created successfully! Published to ${result.successful}/${result.total} relays.`);
          } else {
            throw new Error('Failed to publish to any relay');
          }
        } catch (error) {
          console.error('Failed to create issue:', error);
          this.setState({
            error: error.message || 'Failed to create issue',
            submitting: false
          });
        }
      }

      render() {
        const { onClose } = this.props;
        const { title, description, submitting, error } = this.state;

        return html`
          <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fadeIn"
               onClick=${(e) => e.target === e.currentTarget && onClose()}>
            <div class="bg-dark border border-purple-500/30 rounded-lg max-w-2xl w-full shadow-2xl shadow-purple-500/20">
              <!-- Header -->
              <div class="bg-gradient-to-r from-purple-900/50 to-dark border-b border-purple-500/30 p-6">
                <div class="flex items-center justify-between">
                  <h2 class="text-2xl font-bold text-white">New Issue</h2>
                  <button
                    onClick=${onClose}
                    class="p-2 hover:bg-purple-500/20 rounded-lg transition-colors"
                    title="Close"
                  >
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Form -->
              <form onSubmit=${(e) => this.handleSubmit(e)} class="p-6 space-y-4">
                ${error ? html`
                  <div class="p-4 bg-red-500/10 border border-red-500/30 rounded-lg text-red-300">
                    ${error}
                  </div>
                ` : null}

                <div>
                  <label class="block text-sm font-medium text-gray-300 mb-2">
                    Title *
                  </label>
                  <input
                    type="text"
                    value=${title}
                    onInput=${(e) => this.setState({ title: e.target.value })}
                    disabled=${submitting}
                    placeholder="Brief description of the issue"
                    class="w-full px-4 py-2 bg-black/40 border border-lightgray rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 disabled:opacity-50"
                    required
                  />
                </div>

                <div>
                  <label class="block text-sm font-medium text-gray-300 mb-2">
                    Description
                  </label>
                  <textarea
                    value=${description}
                    onInput=${(e) => this.setState({ description: e.target.value })}
                    disabled=${submitting}
                    placeholder="Detailed description of the issue..."
                    rows="8"
                    class="w-full px-4 py-2 bg-black/40 border border-lightgray rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 disabled:opacity-50 resize-none"
                  ></textarea>
                </div>

                <div class="flex items-center justify-end gap-3 pt-4">
                  <button
                    type="button"
                    onClick=${onClose}
                    disabled=${submitting}
                    class="px-4 py-2 text-gray-400 hover:text-white transition-colors disabled:opacity-50"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    disabled=${submitting || !title.trim()}
                    class="px-6 py-2 bg-purple-600 hover:bg-purple-700 disabled:bg-gray-600 disabled:cursor-not-allowed rounded-lg font-medium transition-colors flex items-center gap-2"
                  >
                    ${submitting ? html`
                      <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                      <span>Creating...</span>
                    ` : 'Create Issue'}
                  </button>
                </div>
              </form>
            </div>
          </div>
        `;
      }
    }

    // Issues Page Component
    class IssuesPage extends Component {
      constructor() {
        super();
        this.state = {
          issues: [],
          loading: true,
          connectedRelays: 0,
          eventCount: 0,
          selectedIssue: null,
          searchQuery: '',
          statusFilter: 'all'
        };
        this.websockets = [];
        this.seenEvents = new Set();
        this.connectedRelayUrls = new Set();
        this.issueReplies = new Map(); // Map issue IDs to their replies
      }

      componentDidMount() {
        const relays = [
          'wss://relay.nostr.net/',
          'wss://nos.lol/',
          'wss://relay.damus.io/',
          'wss://nostr.wine/',
          'wss://relay.snort.social/',
          'wss://nostr.mom/',
          'wss://relay.nostr.band/',
          'wss://purplepag.es/',
          'wss://offchain.pub/',
        ];

        relays.forEach((relayUrl, index) => {
          try {
            const ws = new WebSocket(relayUrl);

            ws.onopen = () => {
              if (!this.connectedRelayUrls.has(relayUrl)) {
                this.connectedRelayUrls.add(relayUrl);
                this.setState({ connectedRelays: this.connectedRelayUrls.size });
              }

              // Subscribe to issues (kind 30618)
              const issueSubscription = JSON.stringify([
                'REQ',
                `issues-${index}`,
                {
                  kinds: [30618],
                  limit: 50,
                },
              ]);
              ws.send(issueSubscription);

              // Subscribe to issue replies (kind 1621)
              const repliesSubscription = JSON.stringify([
                'REQ',
                `replies-${index}`,
                {
                  kinds: [1621],
                  limit: 200,
                },
              ]);
              ws.send(repliesSubscription);
            };

            ws.onmessage = (event) => {
              try {
                const message = JSON.parse(event.data);

                if (message[0] === 'EVENT' && message[2]) {
                  const nostrEvent = message[2];

                  if (this.seenEvents.has(nostrEvent.id)) {
                    return;
                  }
                  this.seenEvents.add(nostrEvent.id);

                  // Handle issue events (kind 30618)
                  if (nostrEvent.kind === 30618) {
                    const issueInfo = this.parseIssueInfo(nostrEvent);

                    this.setState(prevState => {
                      const exists = prevState.issues.some(i => i.id === issueInfo.id);
                      if (exists) return prevState;

                      const updated = [...prevState.issues, issueInfo];
                      const sortedIssues = updated.sort((a, b) => b.created_at - a.created_at);

                      // Notify parent of issues update
                      if (this.props.onIssuesUpdate) {
                        this.props.onIssuesUpdate(sortedIssues);
                      }

                      return {
                        issues: sortedIssues,
                        eventCount: prevState.eventCount + 1,
                        loading: false
                      };
                    });
                  }

                  // Handle reply events (kind 1621)
                  if (nostrEvent.kind === 1621) {
                    const replyInfo = this.parseReplyInfo(nostrEvent);
                    if (replyInfo.issueId) {
                      // Store reply in map
                      if (!this.issueReplies.has(replyInfo.issueId)) {
                        this.issueReplies.set(replyInfo.issueId, []);
                      }
                      const replies = this.issueReplies.get(replyInfo.issueId);
                      if (!replies.some(r => r.id === replyInfo.id)) {
                        replies.push(replyInfo);

                        // Update the corresponding issue with replies
                        this.setState(prevState => {
                          const updatedIssues = prevState.issues.map(issue => {
                            if (issue.id === replyInfo.issueId || issue.identifier === replyInfo.issueId) {
                              return { ...issue, replies: this.issueReplies.get(replyInfo.issueId) };
                            }
                            return issue;
                          });

                          // Notify parent of issues update
                          if (this.props.onIssuesUpdate) {
                            this.props.onIssuesUpdate(updatedIssues);
                          }

                          return { issues: updatedIssues };
                        });
                      }
                    }
                  }
                } else if (message[0] === 'EOSE') {
                  this.setState({ loading: false });
                }
              } catch (err) {
                console.error('Error parsing message:', err);
              }
            };

            ws.onerror = () => {
              console.error(`Failed to connect to ${relayUrl}`);
            };

            ws.onclose = () => {
              if (this.connectedRelayUrls.has(relayUrl)) {
                this.connectedRelayUrls.delete(relayUrl);
                this.setState({ connectedRelays: this.connectedRelayUrls.size });
              }
            };

            this.websockets.push(ws);
          } catch (err) {
            console.error(`Error connecting to ${relayUrl}:`, err);
          }
        });
      }

      componentWillUnmount() {
        this.connectedRelayUrls.clear();
        this.websockets.forEach(ws => {
          if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
            ws.close();
          }
        });
      }

      parseIssueInfo(event) {
        const tags = event.tags || [];
        const info = {
          id: event.id,
          title: '',
          content: event.content || '',
          status: 'open',
          repository: undefined,
          created_at: event.created_at,
          pubkey: event.pubkey,
          identifier: undefined,
          replies: []
        };

        tags.forEach(tag => {
          const [key, value] = tag;

          switch (key) {
            case 'subject':
            case 'title':
              info.title = value || '';
              break;
            case 'd':
              info.identifier = value || '';
              break;
            case 'a':
              info.repository = value;
              break;
            case 'status':
              info.status = value === 'closed' ? 'closed' : 'open';
              break;
          }
        });

        if (!info.title) {
          info.title = `Issue #${event.id.substring(0, 8)}`;
        }

        return info;
      }

      parseReplyInfo(event) {
        const tags = event.tags || [];
        const info = {
          id: event.id,
          content: event.content || '',
          created_at: event.created_at,
          pubkey: event.pubkey,
          issueId: undefined
        };

        // Find the issue this reply is for
        tags.forEach(tag => {
          const [key, value] = tag;
          if (key === 'e') {
            info.issueId = value; // Event ID being replied to
          }
        });

        return info;
      }

                this.connectedRelayUrls.add(relayUrl);
                this.setState({ connectedRelays: this.connectedRelayUrls.size });
              }

                },
              ]);

            ws.onmessage = (event) => {

                const message = JSON.parse(event.data);

                  const nostrEvent = message[2];

                  if (this.seenEvents.has(nostrEvent.id)) {
                    return;
                  }
                  this.seenEvents.add(nostrEvent.id);

                  if (nostrEvent.kind === 30617) {

                      );

        const tags = event.tags || [];

          id: event.id,
          name: '',

          clone: undefined,
          maintainers: [],
          created_at: event.created_at,

          topics: [],

          const [key, value] = tag;

          switch (key) {

            case 'd':
              info.identifier = value || '';
              if (!info.name) info.name = value || '';

              info.web = value;
              break;

              info.clone = value;

              break;
            case 't':

          info.description = event.content;

    // Main App Component with Routing
    class App extends Component {
      constructor() {
        super();
        this.state = {
          currentPage: window.location.hash.slice(1) || '',
          repos: [],
          issues: [],
          nostrPubkey: null,
          nostrConnecting: false
        };
        this.handleReposUpdate = this.handleReposUpdate.bind(this);
        this.handleIssuesUpdate = this.handleIssuesUpdate.bind(this);
        this.addNewIssue = this.addNewIssue.bind(this);
        this.connectNostr = this.connectNostr.bind(this);
        this.disconnectNostr = this.disconnectNostr.bind(this);
        this.publishEvent = this.publishEvent.bind(this);
      }

      componentDidMount() {
        window.addEventListener('hashchange', () => {
          this.setState({ currentPage: window.location.hash.slice(1) || '' });
        });

        // Check if already connected
        const savedPubkey = localStorage.getItem('nostr_pubkey');
        if (savedPubkey && window.nostr) {
          this.setState({ nostrPubkey: savedPubkey });
        }

        // Fetch issues from Nostr relays
        this.fetchIssues();
      }

      fetchIssues() {
        const relays = [
          'wss://relay.nostr.net/',
          'wss://nos.lol/',
          'wss://relay.damus.io/',
          'wss://nostr.wine/',
          'wss://relay.snort.social/',
        ];

        const seenEvents = new Set();
        const issueReplies = new Map();

        relays.forEach((relayUrl, index) => {
          try {
            const ws = new WebSocket(relayUrl);

            ws.onopen = () => {
              // Subscribe to issues (kind 30618)
              ws.send(JSON.stringify([
                'REQ',
                `app-issues-${index}`,
                { kinds: [30618], limit: 100 }
              ]));

              // Subscribe to replies (kind 1621)
              ws.send(JSON.stringify([
                'REQ',
                `app-replies-${index}`,
                { kinds: [1621], limit: 200 }
              ]));
            };

            ws.onmessage = (event) => {
              try {
                const message = JSON.parse(event.data);

                if (message[0] === 'EVENT') {
                  const nostrEvent = message[2];

                  if (seenEvents.has(nostrEvent.id)) return;
                  seenEvents.add(nostrEvent.id);

                  if (nostrEvent.kind === 30618) {
                    // Issue event
                    const titleTag = nostrEvent.tags.find(t => t[0] === 'title');
                    const statusTag = nostrEvent.tags.find(t => t[0] === 'status');
                    const aTag = nostrEvent.tags.find(t => t[0] === 'a');
                    const dTag = nostrEvent.tags.find(t => t[0] === 'd');

                    const issue = {
                      id: nostrEvent.id,
                      pubkey: nostrEvent.pubkey,
                      created_at: nostrEvent.created_at,
                      title: titleTag ? titleTag[1] : 'Untitled',
                      content: nostrEvent.content,
                      status: statusTag ? statusTag[1] : 'open',
                      repository: aTag ? aTag[1] : null,
                      identifier: dTag ? dTag[1] : nostrEvent.id,
                      replies: []
                    };

                    this.setState(prevState => {
                      const exists = prevState.issues.some(i => i.id === issue.id);
                      if (exists) return {};
                      return { issues: [...prevState.issues, issue] };
                    });
                  } else if (nostrEvent.kind === 1621) {
                    // Reply event
                    const eTag = nostrEvent.tags.find(t => t[0] === 'e');
                    if (eTag) {
                      const issueId = eTag[1];
                      const reply = {
                        id: nostrEvent.id,
                        pubkey: nostrEvent.pubkey,
                        created_at: nostrEvent.created_at,
                        content: nostrEvent.content
                      };

                      if (!issueReplies.has(issueId)) {
                        issueReplies.set(issueId, []);
                      }
                      issueReplies.get(issueId).push(reply);

                      // Update issues with replies
                      this.setState(prevState => ({
                        issues: prevState.issues.map(issue => {
                          if (issue.id === issueId || issue.identifier === issueId) {
                            return { ...issue, replies: issueReplies.get(issueId) };
                          }
                          return issue;
                        })
                      }));
                    }
                  }
                }
              } catch (err) {
                console.error('Error parsing message:', err);
              }
            };

            ws.onerror = () => console.error(`Failed to connect to ${relayUrl}`);
          } catch (err) {
            console.error(`Error connecting to ${relayUrl}:`, err);
          }
        });
      }

      async connectNostr() {
        this.setState({ nostrConnecting: true });

        try {
          if (!window.nostr) {
            alert('No Nostr extension found! Please install nos2x, Alby, or another NIP-07 compatible extension.');
            this.setState({ nostrConnecting: false });
            return;
          }

          const pubkey = await window.nostr.getPublicKey();
          this.setState({ nostrPubkey: pubkey, nostrConnecting: false });
          localStorage.setItem('nostr_pubkey', pubkey);
        } catch (error) {
          console.error('Failed to connect to Nostr extension:', error);
          alert('Failed to connect. Please make sure you have approved the connection request.');
          this.setState({ nostrConnecting: false });
        }
      }

      disconnectNostr() {
        this.setState({ nostrPubkey: null });
        localStorage.removeItem('nostr_pubkey');
      }

      async publishEvent(event) {
        if (!window.nostr) {
          throw new Error('No Nostr extension found');
        }

        try {
          // Sign the event with the extension
          const signedEvent = await window.nostr.signEvent(event);

          // Publish to all relays
          const relays = [
            'wss://relay.nostr.net/',
            'wss://nos.lol/',
            'wss://relay.damus.io/',
            'wss://nostr.wine/',
            'wss://relay.snort.social/',
            'wss://nostr.mom/',
            'wss://relay.nostr.band/',
            'wss://purplepag.es/',
            'wss://offchain.pub/',
          ];

          const promises = relays.map(relayUrl => {
            return new Promise((resolve, reject) => {
              const ws = new WebSocket(relayUrl);
              ws.onopen = () => {
                ws.send(JSON.stringify(['EVENT', signedEvent]));
              };
              ws.onmessage = (msg) => {
                const response = JSON.parse(msg.data);
                if (response[0] === 'OK' && response[1] === signedEvent.id) {
                  ws.close();
                  resolve(relayUrl);
                } else if (response[0] === 'OK' && !response[2]) {
                  ws.close();
                  reject(new Error(`Relay rejected: ${response[3]}`));
                }
              };
              ws.onerror = () => {
                ws.close();
                reject(new Error(`Failed to connect to ${relayUrl}`));
              };
              setTimeout(() => {
                ws.close();
                reject(new Error('Timeout'));
              }, 5000);
            });
          });

          const results = await Promise.allSettled(promises);
          const successful = results.filter(r => r.status === 'fulfilled').length;

          return { signedEvent, successful, total: relays.length };
        } catch (error) {
          console.error('Failed to publish event:', error);
          throw error;
        }
      }

      handleReposUpdate(repos) {
        this.setState({ repos });
      }

      handleIssuesUpdate(issues) {
        this.setState({ issues });
      }

      addNewIssue(signedEvent) {
        // Parse the event to create an issue object
        const titleTag = signedEvent.tags.find(t => t[0] === 'title');
        const statusTag = signedEvent.tags.find(t => t[0] === 'status');
        const aTag = signedEvent.tags.find(t => t[0] === 'a');
        const dTag = signedEvent.tags.find(t => t[0] === 'd');

        const newIssue = {
          id: signedEvent.id,
          pubkey: signedEvent.pubkey,
          created_at: signedEvent.created_at,
          title: titleTag ? titleTag[1] : 'Untitled',
          content: signedEvent.content,
          status: statusTag ? statusTag[1] : 'open',
          repository: aTag ? aTag[1] : null,
          identifier: dTag ? dTag[1] : signedEvent.id,
          replies: []
        };

        // Add to issues array
        this.setState(prevState => ({
          issues: [newIssue, ...prevState.issues]
        }));
      }

      render() {
        const { currentPage, repos, issues, nostrPubkey, nostrConnecting } = this.state;

        // Parse the route
        const parts = currentPage.split('/');
        const mainRoute = parts[0];
        const subRoute = parts[1];

        let content;

        if (mainRoute === 'repo' && subRoute) {
          // Repository page route: #repo/{identifier}
          const repo = repos.find(r => r.identifier === subRoute || r.name === subRoute);
          content = html`<${RepoPage}
            repo=${repo}
            allIssues=${issues}
            nostrPubkey=${nostrPubkey}
            publishEvent=${this.publishEvent}
            onNewIssue=${this.addNewIssue}
          />`;
        } else {
          // Standard routes
          switch (mainRoute) {
            case 'explore':
              content = html`<${ExplorePage} onReposUpdate=${this.handleReposUpdate} />`;
              break;
            case 'issues':
              content = html`<${IssuesPage}
                onIssuesUpdate=${this.handleIssuesUpdate}
                nostrPubkey=${nostrPubkey}
                publishEvent=${this.publishEvent}
              />`;
              break;
            case 'about':
              content = html`<${AboutPage} />`;
              break;
            case 'docs':
              content = html`<${DocsPage} />`;
              break;
            default:
              content = html`<${HomePage} />`;
          }
        }

        return html`
          <div>
            <${Navigation}
              currentPage=${mainRoute}
              nostrPubkey=${nostrPubkey}
              nostrConnecting=${nostrConnecting}
              onConnect=${this.connectNostr}
              onDisconnect=${this.disconnectNostr}
            />
            ${content}
          </div>
        `;
      }
    }

    render(html`<${App} />`, document.getElementById('app'));
  </script>

  <!-- Service Worker Registration for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('ServiceWorker registration successful:', registration.scope);
          })
          .catch(err => {
            console.log('ServiceWorker registration failed:', err);
          });
      });
    }
  </script>
